name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run
# in-progress and the latest queued. Do not cancel in-progress runs so
# production deployments can complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@v5

      # deploy-pages requires EXACTLY ONE artifact named "github-pages" in the
      # run. Re-running a workflow (especially "Re-run all jobs") can leave the
      # previous attempt's artifact around, which breaks the deploy with
      # "Multiple artifacts named github-pages". Delete any stale copies first.
      - name: "🧹 Delete stale github-pages artifact"
        uses: GeekyEggo/delete-artifact@v6
        with:
          name: github-pages
          failOnError: false
          useGlob: false

      - name: "📦 Install pnpm"
        uses: pnpm/action-setup@v6
        with:
          version: "11.3.0"

      - name: "⬢ Use Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: "📦 Install dependencies"
        run: pnpm install --frozen-lockfile

      - name: "🚀 Build the Astro site"
        run: pnpm run build

      - name: "📤 Upload artifact"
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: "🚀 Deploy to GitHub Pages"
        id: deployment
        uses: actions/deploy-pages@v5
